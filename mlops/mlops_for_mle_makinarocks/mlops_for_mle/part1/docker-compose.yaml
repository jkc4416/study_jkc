version: "3"  # Compose 파일의 버전을 의미함 (최신 버전은 공식 홈페이지에서 확인 가능)

services:  # Compose에 묶일 서비스들을 의미함 (하나의 서비스는 하나의 컨테이너를 의미)
  postgres-server:  # DB 서버를 실행시키기 위한 내용을 정의할 서비스 이름
    image: postgres:14.0  # 사용할 컨테이너의 이미지를 입력
    container_name: postgres-server  # 서비스의 이름 (입력한 이름은 실행되는 컨테이너의 호스트 이름이 됨)
    ports:  # 컨테이너에서 외부로 노출할 포트 포워딩을 설정 (형식은 host:container 로 사용되며, 여러 개를 지정할 수 있음)
      - 5432:5432
    environment:  # 컨테이너를 실행할 때 사용한 -e 옵션과 같은 역할을 함
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    healthcheck:  # postgres server가 사용 가능한 상태인지 확인하는 단계
      test: ["CMD", "pg_isready", "-q", "-U", "myuser", "-d", "mydatabase"]  # 테스트 할 명령어 설정 (여기서는 pg_isready를 이용하여 DB가 준비상태인지 테스트)
      interval: 10s  # Healthcheck 간격 설정
      timeout: 5s  # Healthcheck의 timeout 설정
      retries: 5  # Timeout 횟수 설정

  data-generator:  # Data generator를 실행시키기 위한 내용을 정의할 서비스 이름
    build:
      context: .  # 이미지를 build 하기 위해 Dockerfile이 있는 절대경로 또는 상대경로를 설정함
      dockerfile: Dockerfile  # context에서 설정한 경로에 있는 Dockerfile의 파일명을 입력
    container_name: data-generator
    depends_on:  # Compose로 띄워지는 서비스 간의 종속성 순서대로 서비스를 시작할 때 사용함
      postgres-server:  # 여기서는 postgres server가 먼저 실행되고 난 후에 Data generator를 실행해야 하기 때문에 postgres server의 서비스 이름인 postgres-server를 입력
        condition: service_healthy  # Healthcheck 기능을 사용하기 위해 depends_on의 parameter로 condition: service_healthy 추가
    command: ["postgres-server"]  # Dockerfile에 작성되어 있는 CMD를 덮어씀 (Data generator가 실행되는 컨테이너 A를 postgres DB가 실행 중인 컨테이너 B에 연결하기 위해서는 호스트 이름은 컨테이너 B의 이름으로 주어야 함)

networks:  # 컨테이너 간 네트워크 생성은 services와 같은 레벨에 networks를 입력하면 됨
  default:  # 서비스 전체의 기본 네트워크를 수정할 수 있음
    name: mlops-network  # 네트워크의 이름을 작성
